name: Build Versus (Boca vs River)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  # pull_request:
  #   branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: python build_app.py --variant versus

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Versus-Windows
        path: dist/versus/

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: python build_app.py --variant versus

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Versus-macOS
        path: dist/versus.app/

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Syntax check core/
      run: python -m py_compile core/*.py

    - name: Syntax check versus variant
      run: python -m py_compile variants/versus/main.py variants/versus/config.py variants/versus/game_engine.py variants/versus/scoreboard_ui.py

    - name: Run versus tests
      run: python -m pytest tests/test_versus_match_flow.py tests/test_versus_scoreboard_ui.py -v
      continue-on-error: false

  release:
    needs: [build-windows, build-macos, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: Versus-Windows
        path: ./windows

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: Versus-macOS
        path: ./macos

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows/
          macos/
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
